<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tanks</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      /* Networking spike (#8); goes when the game replaces it. */
      .spike {
        padding: 8px;
      }
      .spike canvas {
        display: block;
        width: min(100%, calc((100vh - 120px) * 256 / 240));
        image-rendering: pixelated;
        touch-action: none;
        border: 1px solid #444;
      }
      .spike input {
        width: min(60ch, 70vw);
      }
      #build {
        position: fixed;
        right: 4px;
        bottom: 4px;
        font: 11px monospace;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
